name = "vinscout-worker"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Create with: wrangler d1 create vinscout
# then paste the resulting database_id below.
[[d1_databases]]
binding = "DB"
database_name = "vinscout"
database_id = "75ccb5c0-07fa-455f-8920-7001f9f7fe4e"
migrations_dir = "../../migrations"

# Runs the discovery/sync job on a schedule. Adjust cadence to taste —
# free-tier Cron Triggers support standard cron syntax.
[triggers]
crons = ["0 */6 * * *"]

# The fixture adapter is for local pipeline testing only — it must stay off
# in production so the live cron doesn't write fake data into real D1.
# Local dev enables it via .dev.vars (gitignored), which overrides this.
[vars]
ENABLE_FIXTURE_SOURCE = "false"
