name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; let an in-flight deploy finish rather than
# cancelling it halfway through a migration.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  # Migrations run before the new Worker code ships, so code that expects a
  # new column never runs against an old schema. Migrations must stay
  # additive for this to be safe while the previous Worker is still live.
  deploy-worker:
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Uses the repo's own wrangler (from the lockfile) rather than
      # wrangler-action, whose bundled default version conflicts with it.
      - name: Apply D1 migrations
        working-directory: apps/worker
        run: npx wrangler d1 migrations apply vinscout --remote

      - name: Deploy Worker
        working-directory: apps/worker
        run: npx wrangler deploy

  # The dashboard binds to vinscout-worker via a service binding, so it
  # deploys only after the backend is up.
  deploy-web:
    needs: deploy-worker
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Builds with Vite and deploys the dashboard as a Worker with static
      # assets (not classic Pages).
      - name: Deploy dashboard
        run: npm run deploy --workspace=@vinscout/web
